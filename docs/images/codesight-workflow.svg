<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">CodeSight workflow and roadmap</title><desc id="desc">Discover code, inspect evidence, verify in VS Code, then plan A3 conformance.</desc><rect width="1000" height="350" rx="24" fill="#0b1224"/><text x="40" y="57" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="bold">From code discovery to verified developer confidence</text><g font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle"><rect x="38" y="111" width="212" height="116" rx="18" fill="#24314d" stroke="#38bdf8"/><text x="144" y="157" fill="#fff">A1 · Discover</text><text x="144" y="186" fill="#b8c9e2" font-size="14" font-weight="normal">Static source evidence</text><rect x="275" y="111" width="212" height="116" rx="18" fill="#24314d" stroke="#38bdf8"/><text x="381" y="157" fill="#fff">A2 · Explore</text><text x="381" y="186" fill="#b8c9e2" font-size="14" font-weight="normal">Bounded interactive graph</text><rect x="512" y="111" width="212" height="116" rx="18" fill="#31274e" stroke="#c084fc"/><text x="618" y="157" fill="#fff">Verify VSIX</text><text x="618" y="186" fill="#e4d4fc" font-size="14" font-weight="normal">Real VS Code acceptance</text><rect x="749" y="111" width="212" height="116" rx="18" fill="#1b2a3d" stroke="#64748b" stroke-dasharray="6 5"/><text x="855" y="157" fill="#fff">A3 · Conformance</text><text x="855" y="186" fill="#b8c9e2" font-size="14" font-weight="normal">Planned, not started</text></g><g stroke="#67e8f9" stroke-width="3" fill="none"><path d="M251 168h22m-8-7 8 7-8 7"/><path d="M488 168h22m-8-7 8 7-8 7"/><path d="M725 168h22m-8-7 8 7-8 7"/></g><text x="40" y="278" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">A2 implementation exists; release acceptance is still pending. No stable publication is implied.</text><text x="40" y="309" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Source-controlled illustrative diagram — not a UI screenshot.</text></svg>