<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">CodeSight architecture</title><desc id="desc">VS Code workspace flows through local analysis, evidence-based architecture graph, and user-approved actions.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="1000" height="390" rx="24" fill="#0b1224"/><text x="40" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="bold">CodeSight · evidence-first developer intelligence</text><text x="40" y="82" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Local inspection · bounded graphs · explicit developer control</text><g font-family="Arial,sans-serif"><rect x="40" y="135" width="250" height="172" rx="17" fill="#17233b" stroke="#516080"/><text x="63" y="170" font-size="20" font-weight="bold" fill="#fff">VS Code workspace</text><text x="63" y="207" font-size="16" fill="#cbd5e1">Files · manifests · scripts</text><text x="63" y="235" font-size="16" fill="#cbd5e1">Trust and root boundaries</text><text x="63" y="263" font-size="16" fill="#cbd5e1">Native editor APIs</text><path d="M300 220h56" stroke="url(#g)" stroke-width="5"/><path d="m349 210 15 10-15 10" fill="none" stroke="#22d3ee" stroke-width="4"/><rect x="370" y="135" width="265" height="172" rx="17" fill="#17233b" stroke="#516080"/><text x="391" y="170" font-size="20" font-weight="bold" fill="#fff">CodeSight analysis</text><text x="391" y="207" font-size="16" fill="#cbd5e1">Project / workspace doctor</text><text x="391" y="235" font-size="16" fill="#cbd5e1">Static references + evidence</text><text x="391" y="263" font-size="16" fill="#cbd5e1">Bounded graph projection</text><path d="M645 220h55" stroke="url(#g)" stroke-width="5"/><path d="m692 210 15 10-15 10" fill="none" stroke="#22d3ee" stroke-width="4"/><rect x="715" y="135" width="245" height="172" rx="17" fill="#17233b" stroke="#516080"/><text x="736" y="170" font-size="20" font-weight="bold" fill="#fff">Developer decision</text><text x="736" y="207" font-size="16" fill="#cbd5e1">Explore and open evidence</text><text x="736" y="235" font-size="16" fill="#cbd5e1">Review gaps and risks</text><text x="736" y="263" font-size="16" fill="#cbd5e1">Approve run / debug / setup</text></g><text x="40" y="353" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8">Illustrative architecture diagram — not a product screenshot or runtime validation.</text></svg>