name: Bug report
description: Report reproducible CAssets behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: cassets
    attributes:
      label: CAssets version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include the detected stack and whether the workspace was trusted.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
