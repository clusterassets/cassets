name: Extension CI

on:
  pull_request:
    branches: [main]

  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Conventional PR title
        run: node scripts/validate-pr-title.mjs "${{ github.event.pull_request.title }}"

  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Marketplace manifest
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: VS Code integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests — Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests — Windows
        if: runner.os == 'Windows'
        run: npm run test:integration

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs:
      - verify
      - integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Package VSIX
        run: npx vsce package --out cassets-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassets-vsix-${{ github.sha }}
          path: cassets-ci.vsix
          if-no-files-found: error
          retention-days: 14
