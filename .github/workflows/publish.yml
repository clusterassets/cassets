name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      pre_release:
        description: "Publish as VS Code Marketplace pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Package and Publish
    runs-on: ubuntu-latest

    environment:
      name: visual-studio-marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Marketplace manifest
        run: npm run validate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json: $PACKAGE_VERSION"
          echo "tag:          $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version does not match package.json."
            exit 1
          fi

      - name: Package VSIX
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce package \
            --pre-release \
            --out "cassets-${VERSION}.vsix"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce publish \
            --pre-release \
            --packagePath "cassets-${VERSION}.vsix"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          gh release create "v${VERSION}" \
            "cassets-${VERSION}.vsix" \
            --title "CAssets DevReady v${VERSION}" \
            --generate-notes \
            --prerelease
