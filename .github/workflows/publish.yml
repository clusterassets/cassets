name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      pre_release:
        description: "Publish as Visual Studio Marketplace pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Package and Publish
    runs-on: ubuntu-latest

    environment:
      name: visual-studio-marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Marketplace manifest
        run: npm run validate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json: $PACKAGE_VERSION"
          echo "tag:          $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package VSIX (tag/pre-release)
        if: github.event_name == 'push' || inputs.pre_release
        run: |
          npx vsce package             --pre-release             --out "cassets-${{ steps.version.outputs.value }}.vsix"

      - name: Package VSIX (manual stable)
        if: github.event_name == 'workflow_dispatch' && !inputs.pre_release
        run: |
          npx vsce package             --out "cassets-${{ steps.version.outputs.value }}.vsix"

      - name: Publish Marketplace pre-release
        if: github.event_name == 'push' || inputs.pre_release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx vsce publish             --pre-release             --packagePath "cassets-${{ steps.version.outputs.value }}.vsix"

      - name: Publish Marketplace stable
        if: github.event_name == 'workflow_dispatch' && !inputs.pre_release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx vsce publish             --packagePath "cassets-${{ steps.version.outputs.value }}.vsix"

      - name: Create GitHub pre-release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.value }}"             "cassets-${{ steps.version.outputs.value }}.vsix"             --title "CAssets DevReady v${{ steps.version.outputs.value }}"             --generate-notes             --prerelease
